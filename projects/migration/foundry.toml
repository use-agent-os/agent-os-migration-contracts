[profile.default]
# Exact compiler pin: the audited bytecode must be reproducible.
solc = "0.8.28"
# Both target chains support Shanghai opcodes (Base: OP Stack, Robinhood 4663: Arbitrum Orbit).
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# No via-IR: the contracts are small, and the legacy pipeline is the more battle-tested one.
via_ir = false

src = "src"
test = "test"
script = "scripts"
out = "out"
libs = ["lib"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@migration/=src/",
    "forge-std/=lib/forge-std/src/",
]

gas_reports = ["MigrationVault", "MerkleVestingDistributor"]
verbosity = 2
build_info = true

fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 50, fail_on_revert = false }

fs_permissions = [
    { access = 'read', path = './configs' },
    { access = 'read', path = './test/fixtures' },
    { access = 'read-write', path = './deployments' },
]

[rpc_endpoints]
base = "${BASE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 100, fail_on_revert = false }

[profile.lite]
fuzz = { runs = 100 }
invariant = { runs = 32, depth = 25, fail_on_revert = false }

[fmt]
line_length = 120
